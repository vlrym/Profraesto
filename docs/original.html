              <div class="small muted">
                New professors start Available with default consultation hours (Mon–Fri, 1–3 PM),
                editable in the Professor view.
              </div>
            </div>

            <div class="section-heading"><h3>Faculty list</h3><span class="count-badge">${app.data.professors.length} total</span></div>
            ${app.data.professors.length
              ? app.data.professors.map(
                  (professor) => html`
                    <div class="card faculty-manage-card" key=${professor.id}>
                      <div class="row">
                        <div class="fill">
                          <b>${displayName(professor)}</b>
                          <div class="muted small">${professor.department} · ${professor.office} ${professor.active === false ? "· Deactivated" : ""}</div>
                        </div>
                        <button onClick=${() => editProfessor(professor)}>Edit</button>
                        <button onClick=${() => toggleActive(professor)}>${professor.active === false ? "Reactivate" : "Deactivate"}</button>
                      </div>
                    </div>
                  `,
                )
              : html`<div class="card muted">No professors yet. Add the first one above.</div>`}
          </div>
        `;
      }

      /* =====================================================================
         14. MAIN APP: state, actions, and page layout
         ===================================================================== */
      function App() {
        // ---- State ----
        const [data, setData] = useState(loadData);
        const [role, setRole] = useState("student"); // "student" | "professor" | "admin"
        const [tab, setTab] = useState("directory");
        const [selectedProfessorId, setSelectedProfessorId] = useState(""); // for the Professor view
        const [now, setNow] = useState(Date.now());
        const [toastMessage, setToastMessage] = useState(null);
        const [confirmDialog, setConfirmDialog] = useState(null); // { message, onConfirm }
        const [booking, setBooking] = useState(null); // { professorId, appointmentId? }
        const [proposalId, setProposalId] = useState(null);
        const [storageWarning, setStorageWarning] = useState(false);
        const [isDark, setIsDark] = useState(document.documentElement.dataset.theme === "dark");

        // Local-device persistence is for demonstration only; this is not shared or authenticated storage.
        useEffect(() => {
          try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); setStorageWarning(false); }
          catch (e) { setStorageWarning(true); }
        }, [data]);

        // ---- Dark mode ----
        useEffect(() => {
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
        }, [isDark]);

        // ---- Every 5 seconds: refresh the clock and expire Back-at timers / Do Not Disturb ----
        useEffect(() => {
          const intervalId = setInterval(() => {
            const currentTime = Date.now();
            setNow(currentTime);
            setData((previous) => {
              let somethingChanged = false;
              const professors = previous.professors.map((professor) => {
                let updated = professor;
                if (professor.returnAt && professor.returnAt < currentTime) {
                  // Timer ran out: the professor becomes Available
                  updated = { ...updated, returnAt: null, status: "available", updatedAt: currentTime };
                  somethingChanged = true;
                }
                if (professor.dnd && professor.dnd.until && professor.dnd.until < currentTime) {
                  updated = { ...updated, dnd: null };
                  somethingChanged = true;
                }
                return updated;
              });
              let appointments = previous.appointments;
              const today = getPhilippineNow(currentTime);
              appointments = appointments.map(a => {
                if ((a.status === "Pending" && slotStartsInPast(a.date, a.time, currentTime)) || (a.status === "Proposed" && a.proposal && slotStartsInPast(a.proposal.date, a.proposal.time, currentTime))) {
                  somethingChanged = true;
                  return { ...a, status: "Expired" };
                }
                return a;
              });
              let notifications = previous.notifications;
              // A reminder appears when this browser is open within 60 minutes of an approved visit.
              appointments.filter(a => a.status === "Approved" && a.student === STUDENT_NAME && a.date === today.date
                && timeToMinutes(a.time) > today.minutes && timeToMinutes(a.time) - today.minutes <= 60).forEach(a => {
                  if (!notifications.some(n => n.reminderFor === a.id && n.reminderDate === a.date && n.reminderTime === a.time)) {
                    notifications = [{ id: newId(), to: "student", professorId: a.professorId, text: `Reminder: your confirmed consultation is today at ${formatTime12h(a.time)}.`, read: false, createdAt: currentTime, reminderFor: a.id, reminderDate: a.date, reminderTime: a.time }, ...notifications];
                    somethingChanged = true;
                  }
                });
              return somethingChanged ? { ...previous, professors, appointments, notifications } : previous;
            });
          }, 5000);
          return () => clearInterval(intervalId);
        }, []);

        // ---- Small data helpers ----
        const showToast = (message) => {
          setToastMessage(message);
          setTimeout(() => setToastMessage(null), 3500);
        };
        const updateData = (key, updater) =>
          setData((previous) => ({ ...previous, [key]: updater(previous[key]) }));
        const findProfessor = (id) => data.professors.find((professor) => professor.id === id);
        const updateProfessor = (id, changes) =>
          updateData("professors", (list) => list.map((p) => (p.id === id ? { ...p, ...changes } : p)));
        const setStatus = (id, status, returnAt = null) =>
          updateProfessor(id, { status, returnAt, updatedAt: Date.now() });
        const updateAppointment = (id, changes) =>
          updateData("appointments", (list) => list.map((a) => (a.id === id ? { ...a, ...changes } : a)));
        const notify = (to, professorId, text) =>
          updateData("notifications", (list) => [
            { id: newId(), to, professorId, text, read: false, createdAt: Date.now() },
            ...list,
          ]);

        // The professor currently shown in the Professor view (defaults to the first one).
        const currentProfessor = (findProfessor(selectedProfessorId)?.active !== false ? findProfessor(selectedProfessorId) : null) || data.professors.find(p => p.active !== false);
        const currentProfessorId = currentProfessor && currentProfessor.id;

        // ---- Booking helpers ----

        // All open 30-minute consultation slots for the next 14 days (Philippine Time).
        function getOpenSlots(professor) {
          if (!professor || professor.active === false) return [];
          const today = getPhilippineNow();
          const slots = [];
          const seen = new Set();
          for (let dayOffset = 0; dayOffset < 14; dayOffset++) {
            const date = addDays(today.date, dayOffset);
            if (blocksDate(professor, date)) continue;
            const weekday = getDayOfWeek(date);
            professor.schedule.filter(x => x.type === "consult" && x.day === weekday).forEach(entry => {
              for (let minutes = timeToMinutes(entry.start); minutes + 30 <= timeToMinutes(entry.end); minutes += 30) {
                const time = minutesToTime(minutes);
                const key = date + time;
                if (seen.has(key) || slotStartsInPast(date, time) || classOverlaps(professor, weekday, minutes, minutes + 30)) continue;
                seen.add(key);
                slots.push({ date, time, capacity: entry.capacity });
              }
            });
          }
          return slots.sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
        }

        // A slot is "taken" when pending + approved bookings reach its capacity (default 1).
        function isSlotTaken(professorId, date, time, capacity, excludeId = null) {
          const bookings = data.appointments.filter(
            (a) =>
              a.professorId === professorId &&
              a.id !== excludeId &&
              ((a.date === date && a.time === time && ["Pending", "Approved"].includes(a.status)) ||
               (a.status === "Proposed" && a.proposal?.date === date && a.proposal?.time === time)),
          );
          return bookings.length >= (capacity || 1);
        }

        // Validates and creates a request. Returns an error message, or null on success.
        function requestAppointment(professor, date, time, category, description, rescheduleId = null) {
          const today = getPhilippineNow();
          if (!professor || professor.active === false) return "This faculty member is not accepting requests.";
          if (!date || !time) return "Choose a date and a time slot.";
          if (description.trim().length < 5) return "Add a short description (at least 5 characters).";
          if (date < today.date || (date === today.date && timeToMinutes(time) <= today.minutes))
            return "That time has already passed.";

          const slot = getOpenSlots(professor).find((s) => s.date === date && s.time === time);
          if (!slot) return "That time is outside consultation hours.";
          if (isSlotTaken(professor.id, date, time, slot.capacity, rescheduleId))
            return "That slot is already booked — pick another.";

          const original = rescheduleId && data.appointments.find(a => a.id === rescheduleId && a.professorId === professor.id && a.student === STUDENT_NAME && ["Pending", "Approved"].includes(a.status));
          if (rescheduleId && !original) return "That appointment is no longer eligible for rescheduling.";
          if (original && original.date === date && original.time === time) return "Choose a different time to reschedule.";
          const record = { id: rescheduleId || newId(), student: STUDENT_NAME, professorId: professor.id, date, time, category, description: description.trim(), status: "Pending", response: "", createdAt: Date.now() };
          updateData("appointments", list => rescheduleId ? list.map(a => a.id === rescheduleId ? record : a) : [record, ...list]);
          notify(
            "professor",
            professor.id,
            `${STUDENT_NAME} ${rescheduleId ? "requested a reschedule" : "requested a " + category + " consultation"} on ${formatDate(date)} at ${formatTime12h(time)}.`,
          );
          showToast(`${rescheduleId ? "Reschedule" : "Booking"} request sent — awaiting professor approval.`);
          return null;
        }

        // ---- Everything the child components can call ----
        const app = {
          data,
          role,
          now,
          currentProfessorId,
          setTab,
          showToast,
          updateData,
          findProfessor,
          updateProfessor,
          setStatus,
          getOpenSlots,
          isSlotTaken,
          requestAppointment,
          getAvailability: professor => availabilityFor(professor, now, data.appointments),
          nextSlotText: professor => {
            const next = getOpenSlots(professor).find(s => !isSlotTaken(professor.id, s.date, s.time, s.capacity));
            return next ? `Next bookable: ${formatDate(next.date)} at ${formatTime12h(next.time)}` : "No open slots in the next 14 days";
          },
          openBooking: (professorId, appointmentId = null) => setBooking({ professorId, appointmentId }),
          openProposal: appointment => setProposalId(appointment.id),
          proposeTime: (appointment, date, time) => {
            if (appointment.status !== "Pending") return "Only pending requests can receive alternative times.";
            const prof = findProfessor(appointment.professorId);
            const slot = getOpenSlots(prof).find(s => s.date === date && s.time === time);
            if (!slot || isSlotTaken(prof.id, date, time, slot.capacity, appointment.id)) return "That time is no longer available.";
            if (appointment.date === date && appointment.time === time) return "Choose a different time.";
            updateAppointment(appointment.id, { status: "Proposed", proposal: { date, time } });
            notify("student", prof.id, `${displayName(prof)} offered ${formatDate(date)} at ${formatTime12h(time)} instead. Accept or decline in My appointments.`);
            showToast("Alternative time proposed to student.");
            return null;
          },
          answerProposal: (appointment, accepted) => {
            if (appointment.status !== "Proposed" || !appointment.proposal) return;
            const professor = findProfessor(appointment.professorId);
            const { date, time } = appointment.proposal;
            if (accepted) {
              const slot = getOpenSlots(professor).find(s => s.date === date && s.time === time);
              if (!slot || isSlotTaken(professor.id, date, time, slot.capacity, appointment.id)) return showToast("Proposed slot is no longer available. Contact the professor.");
            }
            updateAppointment(appointment.id, accepted ? { date, time, status: "Approved", proposal: null, response: "Student accepted alternative time." } : { status: "Rejected", proposal: null, response: "Student declined proposed time." });
            notify("professor", professor.id, `${STUDENT_NAME} ${accepted ? "accepted" : "declined"} the proposed consultation time.`);
            showToast(accepted ? "Consultation confirmed." : "Suggested time declined.");
          },
          askToConfirm: (message, onConfirm) => setConfirmDialog({ message, onConfirm }),
          warnConflictingAppointments: (professorId, message, appointmentIds = null) => {
            const affected = data.appointments.filter(a => a.professorId === professorId && ["Pending", "Approved"].includes(a.status)
              && !slotStartsInPast(a.date, a.time) && (!appointmentIds || appointmentIds.includes(a.id)));
            affected.forEach(a => notify("student", professorId, `${formatDate(a.date)} at ${formatTime12h(a.time)}: ${message}`));
          },
          blockDates: (professor, absence) => {
            const updated = { ...professor, exceptions: [...(professor.exceptions || []), { ...absence, id: newId() }] };
            updateProfessor(professor.id, { exceptions: updated.exceptions });
            const affected = data.appointments.filter(a => a.professorId === professor.id && ["Pending", "Approved"].includes(a.status)
              && a.date >= absence.startDate && a.date <= absence.endDate && !slotStartsInPast(a.date, a.time));
            affected.forEach(a => notify("student", professor.id, `${displayName(professor)} marked ${formatDate(a.date)} unavailable (${absence.reason}). Your ${a.status.toLowerCase()} booking may need rescheduling.`));
          },
          changeSchedule: (professor, updatedSchedule) => {
            updateProfessor(professor.id, { schedule: updatedSchedule });
            const changed = { ...professor, schedule: updatedSchedule };
            data.appointments.filter(a => a.professorId === professor.id && ["Pending", "Approved"].includes(a.status) && !slotStartsInPast(a.date, a.time)
              && appointmentConflicts(changed,a) && !appointmentConflicts(professor,a))
              .forEach(a => notify("student", professor.id, `Schedule change: Your ${formatDate(a.date)} ${formatTime12h(a.time)} consultation now conflicts with a class. Please reschedule or contact ${displayName(professor)}.`));
          },

          toggleFavorite: (id) =>
            updateData("favoriteIds", (ids) => (ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id])),

          // Professor approves or rejects a pending request.
          decide: (appointment, newStatus, response) => {
            if (appointment.status !== "Pending" || slotStartsInPast(appointment.date, appointment.time)) return showToast("This request can no longer be approved.");
            const prof = findProfessor(appointment.professorId);
            if (newStatus === "Approved" && !getOpenSlots(prof).some(s => s.date === appointment.date && s.time === appointment.time))
              return showToast("The slot now conflicts with the schedule or a blocked date. Suggest another time or reject.");
            updateAppointment(appointment.id, { status: newStatus, response: response.trim() });
            notify(
              "student",
              null,
              `${displayName(findProfessor(appointment.professorId))} ${newStatus.toLowerCase()} your ${appointment.category} request for ${formatDate(appointment.date)}, ${formatTime12h(appointment.time)}.`,
            );
            showToast(`Request ${newStatus.toLowerCase()}.`);
          },

          // Student cancels their own pending request.
          cancel: (appointment) =>
            ["Pending", "Approved"].includes(appointment.status) && !slotStartsInPast(appointment.date, appointment.time)
              ? setConfirmDialog({
              message: `Cancel your request to ${displayName(findProfessor(appointment.professorId))} on ${formatDate(appointment.date)}, ${formatTime12h(appointment.time)}?`,
              onConfirm: () => {
                updateAppointment(appointment.id, { status: "Cancelled" });
                notify(
                  "professor",
                  appointment.professorId,
                  `${appointment.student} cancelled the request for ${formatDate(appointment.date)}, ${formatTime12h(appointment.time)}.`,
                );
                showToast("Request cancelled.");
              },
            }) : showToast("This appointment can no longer be cancelled."),

          // Professor marks an approved consultation as done.
          complete: (appointment) => {
            updateAppointment(appointment.id, { status: "Completed" });
            notify(
              "student",
              null,
              `Your consultation with ${displayName(findProfessor(appointment.professorId))} was marked completed.`,
            );
            showToast("Marked completed.");
          },

          respondToKnock: (notification, response) => {
            if (notification.response) return;
            updateData("notifications", list => list.map(n => n.id === notification.id ? { ...n, response, read: true } : n));
            notify("student", notification.professorId, `${displayName(findProfessor(notification.professorId))} replied to your Knock: ${response}.`);
            showToast("Knock response sent.");
          },
          // A Knock is a one-way request until faculty chooses a response; never a booking.
          knock: professor => {
            if (!["available", "unknown"].includes(availabilityFor(professor, Date.now(), data.appointments).status)) return showToast("Knock is currently unavailable.");
            const recent = data.notifications.some(n => n.kind === "knock" && n.professorId === professor.id && Date.now() - n.createdAt < 15 * MINUTE);
            if (recent) return showToast("You already knocked recently. Check Alerts for a reply.");
            setConfirmDialog({
              message: `Knock on ${displayName(professor)}? The professor may reply Come in, Please wait or Not available. A Knock is not an appointment.`,
              onConfirm: () => {
                updateData("notifications", list => [{ id: newId(), to: "professor", professorId: professor.id, kind: "knock", text: `${STUDENT_NAME} knocked — asking whether they may visit ${professor.office}.`, read: false, createdAt: Date.now(), response: null }, ...list]);
                showToast("Knock sent. Check Alerts for a response.");
              },
            });
          },
        };

        // ---- Layout ----
        const unreadCount = data.notifications.filter(
          (n) =>
            !n.read &&
            (role === "student" ? n.to === "student" : role === "professor" && n.to === "professor" && n.professorId === currentProfessorId),
        ).length;

        function switchRole(newRole) {
          setRole(newRole);
          setTab(TABS_BY_ROLE[newRole][0][0]); // open that role's first tab
        }

        const professorViewHasNoProfessor = role === "professor" && !currentProfessor;
        const bookingProfessor = booking && findProfessor(booking.professorId);
        const bookingAppointment = booking && booking.appointmentId && data.appointments.find(a => a.id === booking.appointmentId);
        const proposalAppointment = proposalId && data.appointments.find(a => a.id === proposalId);

        return html`
          <div>
            <header class="app-header">
              <div class="header-inner">
                <div class="brand-mark" aria-hidden="true">P</div>
                <div class="brand-copy"><b class="app-title">Profraesto</b><span class="brand-subtitle">Faculty availability portal</span></div>
                <div class="header-actions">
                  <span class="header-label">Viewing as</span>
                  <select class="role-select" aria-label="Switch user role" value=${role} onChange=${(event) => switchRole(event.target.value)}>
                    <option value="student">Student</option>
                    <option value="professor">Professor</option>
                    <option value="admin">Admin</option>
                  </select>
                  <button class="theme-toggle" title="Dark mode" aria-label="Toggle dark mode" onClick=${() => setIsDark(!isDark)}>${isDark ? "☀" : "☾"}</button>
                </div>
              </div>
            </header>
            <nav class="tabs" aria-label="Main navigation"><div class="tabs-inner">
              ${TABS_BY_ROLE[role].map(
                ([tabId, tabLabel]) => html`
                  <button key=${tabId} class=${tab === tabId ? "active" : ""} aria-current=${tab === tabId ? "page" : undefined} onClick=${() => setTab(tabId)}>
                    ${tabLabel}${tabId === "alerts" && unreadCount > 0 ? ` (${unreadCount})` : ""}${tabId === "requests" && data.appointments.some(a => a.professorId === currentProfessorId && a.status === "Pending") ? ` (${data.appointments.filter(a => a.professorId === currentProfessorId && a.status === "Pending").length})` : ""}
                  </button>
                `,
              )}
            </div></nav>

            <main>
              <div class="demo-warning" role="note"><b>Local prototype</b> — Data is saved only in this browser, not synced between users or devices. Role switching is for demonstration, not secure login. ${storageWarning ? "Your browser is blocking local storage; changes may disappear on refresh." : ""}</div>
              <div class="page-intro">
                <div>
                  <span class="eyebrow">${role === "student" ? "Student portal" : role === "professor" ? "Faculty portal" : "Administration"}</span>
                  <h1>${({ directory: "Faculty directory", appointments: "My appointments", alerts: "Notifications", status: "Availability status", requests: "Consultation requests", schedule: "Faculty schedule", manage: "Manage faculty" })[tab] || "Dashboard"}</h1>
                  <p>${({ directory: "Check faculty availability and find the right time to connect.", appointments: "Review upcoming consultations and your request history.", alerts: "Stay informed about consultation updates and requests.", status: "Let students know when you're available for consultation.", requests: "Review, approve, and manage consultation requests.", schedule: "Manage your weekly class and consultation hours.", manage: "Add faculty members and maintain the directory." })[tab] || ""}</p>
                </div>
              </div>
              ${professorViewHasNoProfessor
                ? html`<div class="empty-state">No professors yet. Switch to Admin to add one.</div>`
                : html`
                    <div class="stack page-content">
                      ${role === "professor" &&
                      html`
                        <div class="professor-picker">
                          <label for="professor-view-select">Viewing as professor</label>
                          <select id="professor-view-select" value=${currentProfessorId}
                            onChange=${(event) => setSelectedProfessorId(event.target.value)}>
                            ${data.professors.filter(p => p.active !== false).map(
                              (professor) => html`<option key=${professor.id} value=${professor.id}>${displayName(professor)}</option>`,
                            )}
                          </select>
                        </div>
                      `}

                      ${tab === "directory" && html`<${Directory} app=${app} />`}
                      ${role === "student" &&
                      tab === "appointments" &&
                      html`<${AppointmentList}
                        app=${app}
                        professorView=${false}
                        appointments=${data.appointments.filter((a) => a.student === STUDENT_NAME)}
                      />`}
                      ${tab === "alerts" && html`<${Notifications} app=${app} />`}
                      ${role === "professor" &&
                      tab === "status" &&
                      html`<${StatusPanel} key=${currentProfessorId} app=${app} professor=${currentProfessor} />`}
                      ${role === "professor" &&
                      tab === "requests" &&
                      html`<${AppointmentList}
                        app=${app}
                        professorView=${true}
                        appointments=${data.appointments.filter((a) => a.professorId === currentProfessorId)}
                      />`}
                      ${role === "professor" &&
                      tab === "schedule" &&
                      html`<${SchedulePanel} key=${currentProfessorId} app=${app} professor=${currentProfessor} />`}
                      ${tab === "manage" && html`<${ManageFaculty} app=${app} />`}

                      <footer class="demo-footer">Demo prototype · fictional data · not an official LPU-Davao application.</footer>
                    </div>
                  `}
            </main>

            ${bookingProfessor &&
            html`<${BookingDialog}
              key=${bookingProfessor.id + (bookingAppointment ? bookingAppointment.id : "new")}
              professor=${bookingProfessor}
              appointment=${bookingAppointment}
              app=${app}
              onClose=${() => setBooking(null)}
            />`}

            ${proposalAppointment && findProfessor(proposalAppointment.professorId) && html`<${ProposalDialog}
              appointment=${proposalAppointment}
              professor=${findProfessor(proposalAppointment.professorId)}
              app=${app}
              onClose=${() => setProposalId(null)}
            />`}

            ${confirmDialog &&
            html`
              <div class="overlay" style=${{ zIndex: 70 }}>
                <div class="modal">
                  <h3>Confirm action</h3>
                  <div>${confirmDialog.message}</div>
                  <div class="modal-actions">
                    <button onClick=${() => setConfirmDialog(null)}>Cancel</button>
                    <button
                      class="primary"
                      onClick=${() => {
                        confirmDialog.onConfirm();
                        setConfirmDialog(null);
                      }}
                    >
                      Confirm
                    </button>
                  </div>
                </div>
              </div>
            `}
            ${toastMessage && html`<div class="toast">${toastMessage}</div>`}
          </div>
        `;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>
  </body>
</html>
